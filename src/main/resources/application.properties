spring.application.name=policygate-devlab
server.port=5050

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/policygate_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.seed.admin-username=${ADMIN_USERNAME:admin}
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
app.seed.user-username=${USER_USERNAME:user}
app.seed.user-password=${USER_PASSWORD:user123}